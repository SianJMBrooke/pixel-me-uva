<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pixel Me Arcade</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Pixel Me">
<meta name="theme-color" content="#000000">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{--p0:#ff3cf0;--p1:#29e3ff;--bg:#000;--ink:#fff;--dim:#86a9b4;--gold:#ffe600;--panel:#05070a;--pink:#ff3d9a;--lime:#b6ff3b}
  *{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  html,body{-webkit-touch-callout:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);touch-action:none;
    font-family:"Press Start 2P",ui-monospace,Menlo,monospace}
  #app{position:fixed;inset:0}
  .screen{position:absolute;inset:0;display:none;flex-direction:column}
  .screen.on{display:flex}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges}
  button{font-family:inherit;touch-action:manipulation}
  .btn{border:none;border-radius:0;cursor:pointer;color:#000;background:var(--gold);font-size:clamp(11px,1.6vmin,18px);
    padding:1.6vmin 2.4vmin;box-shadow:0 .6vmin 0 #9c8400,0 0 0 .4vmin #000;margin:.8vmin;letter-spacing:1px}
  .btn{text-shadow:none}
  .btn:not(.alt){box-shadow:0 .6vmin 0 #9c8400,0 0 0 .4vmin #000,0 0 2vmin rgba(255,230,0,.55)}
  .btn.alt{background:#061015;color:var(--p1);outline:.3vmin solid var(--p1);box-shadow:0 0 1.6vmin rgba(41,227,255,.45)}
  .btn:active{transform:translateY(.5vmin);box-shadow:0 .1vmin 0 #9c8400,0 0 0 .4vmin #000}
  .btn.big{font-size:clamp(14px,2.4vmin,26px);padding:2.2vmin 3.2vmin}
  .btn:disabled{opacity:.35}
  .title{text-align:center;font-size:clamp(20px,4.6vmin,52px);padding:2vmin 0 1vmin;letter-spacing:3px;
    color:#fff;text-shadow:0 .5vmin 0 var(--p0),0 1vmin 0 #4a0a4a,0 0 3vmin rgba(41,227,255,.35)}
  .title span{color:var(--gold)}
  .sub{text-align:center;color:var(--dim);font-size:clamp(9px,1.4vmin,15px);margin-bottom:1.2vmin}

  /* lobby */
  .split{flex:1;display:flex;gap:1.6vmin;padding:0 1.6vmin 1.6vmin;min-height:0}
  .panel{flex:1;background:var(--panel);border:.6vmin solid var(--pc);display:flex;flex-direction:column;align-items:center;
    justify-content:center;position:relative;padding:1.4vmin;min-width:0;box-shadow:0 0 2.2vmin var(--pc),inset 0 0 2.4vmin color-mix(in srgb,var(--pc) 22%,transparent)}
  .panel .ptag{position:absolute;top:1vmin;left:1.2vmin;color:var(--pc);font-size:clamp(12px,2vmin,22px)}
  .mid{width:24vmin;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .bigmsg{font-size:clamp(12px,2.2vmin,24px);text-align:center;line-height:1.6;margin:2vmin 0}
  .blink{animation:blink 1.1s steps(2) infinite}
  @keyframes blink{50%{opacity:.25}}
  .camwrap{position:relative;width:min(42vmin,90%);aspect-ratio:1;background:#000;border:.4vmin solid var(--pc)}
  .camwrap canvas{width:100%;height:100%;display:block}
  .guide{position:absolute;inset:8% 22% 3%;border:.35vmin dashed rgba(255,255,255,.55);border-radius:40% 40% 4% 4%/25% 25% 4% 4%;pointer-events:none}
  .count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14vmin;color:#fff;
    text-shadow:.6vmin .6vmin 0 var(--pc);pointer-events:none}
  .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .35s}
  .flash.go{opacity:1;transition:none}
  .hint{font-size:clamp(9px,1.3vmin,14px);color:var(--dim);margin:1.2vmin 0;text-align:center;line-height:1.6}
  .row{display:flex;flex-wrap:wrap;justify-content:center;align-items:center}
  .spritebig{width:min(34vmin,80%);aspect-ratio:1;background:repeating-conic-gradient(#23292c 0 25%,#181c1e 0 50%) 0 0/4vmin 4vmin;border:.4vmin solid var(--pc)}
  .spritesm{width:18vmin;height:18vmin}
  .choose{display:flex;flex-direction:column;align-items:stretch;gap:.6vmin;margin:1.2vmin 0;width:min(46vmin,92%)}
  .choose .btn{margin:.4vmin 0;line-height:1.5}
  .kbd{color:var(--dim);font-size:clamp(7px,1vmin,11px)}
  .robbtn{border-color:var(--lime)!important;color:var(--lime)!important;outline-color:var(--lime)!important}
  .cpu{font-size:clamp(14px,2.6vmin,28px);color:var(--pc);border:.4vmin dashed var(--pc);padding:2vmin 2.4vmin;text-align:center;line-height:1.6}
  .browse{display:flex;align-items:center;justify-content:center;gap:1.2vmin;width:100%}
  .browse .spritebig{width:min(30vmin,64%)}
  .arrow{flex:none;width:7vmin;height:12vmin;background:#061015;color:var(--pc);border:.4vmin solid var(--pc);font-size:clamp(16px,3.2vmin,34px);cursor:pointer;box-shadow:0 0 1.4vmin var(--pc)}
  .arrow:active{background:var(--pc);color:#000}
  .count2{color:var(--dim)}
  /* instructions pop-up */
  #intro{position:fixed;inset:0;z-index:15;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center}
  #intro.on{display:flex}
  #intro .box{width:min(900px,92vw);background:var(--panel);border:.6vmin solid var(--p1);box-shadow:0 0 3vmin rgba(41,227,255,.5);padding:2.6vmin 3vmin;display:flex;flex-direction:column;align-items:center;gap:1.4vmin}
  #intro .eyebrow{color:var(--dim);font-size:clamp(9px,1.4vmin,15px);letter-spacing:2px}
  #intro h2{margin:0;color:var(--gold);font-weight:normal;font-size:clamp(20px,4.4vmin,48px);text-shadow:0 .5vmin 0 var(--p0)}
  #intro canvas{width:min(46vmin,70vw);aspect-ratio:4/3;background:#050505;border:.4vmin solid #23292c;image-rendering:pixelated}
  #intro ol{margin:0;padding-left:3.6vmin;color:var(--ink);font-size:clamp(10px,1.7vmin,18px);line-height:1.9;max-width:62ch}
  #intro .ctl{color:var(--lime);font-size:clamp(9px,1.5vmin,16px);text-align:center;line-height:1.7}
  #intro .readyrow{display:flex;gap:2vmin;flex-wrap:wrap;justify-content:center}
  #intro .rbtn{min-width:26vmin;font-family:inherit;font-size:clamp(12px,2vmin,22px);padding:1.8vmin 2vmin;background:#061015;color:var(--pc);border:.5vmin solid var(--pc);cursor:pointer;box-shadow:0 0 1.6vmin var(--pc)}
  #intro .rbtn.on{background:var(--pc);color:#000}
  #intro .auto{color:var(--dim);font-size:clamp(9px,1.3vmin,14px)}
  /* idle reset notice */
  #idle{position:fixed;left:50%;bottom:2vmin;transform:translateX(-50%);z-index:30;background:#000;border:.4vmin solid var(--gold);color:var(--gold);
    font-size:clamp(10px,1.6vmin,17px);padding:1.2vmin 2vmin;display:none;box-shadow:0 0 2vmin rgba(255,230,0,.45);white-space:nowrap}
  #idle.on{display:block}
  .namebox{font-size:clamp(14px,3vmin,32px);color:var(--pc);min-height:4.4vmin;margin:1vmin 0;letter-spacing:.6vmin;border-bottom:.4vmin solid var(--pc);padding:0 1vmin;min-width:30vmin;text-align:center}
  .kb{display:flex;flex-direction:column;align-items:center;gap:.7vmin;margin-top:.6vmin}
  .kb div{display:flex;gap:.7vmin}
  .kb button{width:5.4vmin;height:5.4vmin;min-width:30px;min-height:30px;font-size:clamp(10px,1.8vmin,18px);border:none;background:#262c2f;color:var(--ink);box-shadow:0 .4vmin 0 #111416}
  .kb button:active{background:var(--pc);color:#000}
  .kb button.w{width:11vmin}
  .kb button.ok{background:var(--gold);color:#000}
  .ready{color:var(--lime);text-shadow:0 0 2vmin var(--lime);font-size:clamp(16px,3.4vmin,36px);margin:1vmin}
  .lbmini{width:100%;font-size:clamp(8px,1.2vmin,13px);line-height:2}
  .lbmini h3{font-size:clamp(10px,1.5vmin,16px);color:var(--gold);text-align:center;margin:0 0 1vmin}
  .lbmini .r{display:flex;align-items:center;gap:.8vmin}
  .lbmini img{width:3.4vmin;height:3.4vmin;image-rendering:pixelated}
  .lbmini .n{flex:1;overflow:hidden;white-space:nowrap}

  /* select */
  #select .vs{display:flex;align-items:center;justify-content:center;gap:4vmin;margin:1vmin 0 2vmin}
  #select .vs canvas{width:22vmin;height:22vmin}
  #select .vs .nm{font-size:clamp(12px,2.2vmin,24px);text-align:center;margin-top:.8vmin}
  .cards{flex:1;display:flex;gap:2.4vmin;padding:0 3vmin 3vmin;min-height:0}
  .card{flex:1;background:var(--panel);border:.6vmin solid var(--p1);box-shadow:0 0 2vmin rgba(41,227,255,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;
    cursor:pointer;color:var(--ink);padding:2vmin}
  .card:active{border-color:var(--pink);box-shadow:0 0 3vmin var(--pink);transform:scale(.98)}
  .card canvas{width:min(26vmin,16vw);height:auto;aspect-ratio:4/3;background:#050505;margin-bottom:2vmin}
  .card b{font-size:clamp(14px,2.6vmin,28px);color:var(--gold);font-weight:normal}
  .card i{font-style:normal;font-size:clamp(9px,1.4vmin,15px);color:var(--dim);margin-top:1.4vmin;line-height:1.7;text-align:center}

  /* play */
  #play{flex-direction:row}
  .pad{width:24vw;display:flex;flex-direction:column;align-items:center;justify-content:space-around;padding:1.4vmin;background:#0a0a0a;border-right:.4vmin solid #23292c}
  #pad1{border-right:none;border-left:.4vmin solid #23292c}
  .pad .pn{font-size:clamp(11px,2vmin,22px);color:var(--pc);text-align:center}
  .dpad{position:relative;width:min(36vmin,21vw);aspect-ratio:1;touch-action:none}
  .dpad i{position:absolute;width:33.4%;height:33.4%;background:#262c2f;box-shadow:inset 0 -.6vmin 0 #151a1c}
  .dpad i.u{left:33.3%;top:0}.dpad i.d{left:33.3%;bottom:0}.dpad i.l{left:0;top:33.3%}.dpad i.r{right:0;top:33.3%}.dpad i.c{left:33.3%;top:33.3%;box-shadow:none}
  .dpad i.on{background:var(--pc);box-shadow:0 0 2vmin var(--pc)}
  .dpad i:not(.c):after{content:"";position:absolute;left:50%;top:50%;border:1.6vmin solid transparent;transform:translate(-50%,-50%)}
  .dpad i.u:after{border-bottom-color:#000;margin-top:-.8vmin}.dpad i.d:after{border-top-color:#000;margin-top:.8vmin}
  .dpad i.l:after{border-right-color:#000;margin-left:-.8vmin}.dpad i.r:after{border-left-color:#000;margin-left:.8vmin}
  .abtns{display:flex;gap:2.4vmin;align-items:center}
  .abtn{width:min(14vmin,9vw);aspect-ratio:1;border-radius:50%;border:none;font-size:clamp(14px,3vmin,32px);color:#000;touch-action:none;
    background:var(--pc);box-shadow:0 .8vmin 0 rgba(0,0,0,.45)}
  .abtn.b{background:#5d747c;color:var(--ink);transform:translateY(-3vmin)}
  .abtn.on{filter:brightness(1.5);box-shadow:0 .2vmin 0 rgba(0,0,0,.45)}
  .abtn .lab{display:block;font-size:clamp(7px,1vmin,11px);margin-top:.4vmin}
  .stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;background:#000;min-width:0}
  #game{width:100%;height:100%;object-fit:contain}
  #btnQuit{position:absolute;top:1vmin;left:50%;transform:translateX(-50%);font-size:clamp(8px,1.1vmin,12px);background:rgba(40,46,50,.85);
    color:var(--ink);border:none;padding:1vmin 1.6vmin}
  #btnQuit .bar{display:block;height:.4vmin;background:var(--gold);width:0;margin-top:.5vmin}

  /* big screen: play area in the middle with a clear border, compact solid controls in the bottom corners (never on the play area) */
  #play{--side:max(22vmin,15vw)}
  #play .stage{position:absolute;top:0;bottom:0;left:var(--side);right:var(--side);z-index:1;background:#000;padding:6vmin 0 2vmin;box-sizing:border-box}
  #play #game{width:min(100%,calc((100vh - 8.5vmin) * 4 / 3));height:auto;aspect-ratio:4/3;object-fit:fill;box-sizing:border-box;
    border:.6vmin solid #fff;box-shadow:0 0 0 .5vmin #000,0 0 3vmin rgba(255,255,255,.35),inset 0 0 0 .2vmin #000}
  #play .pad{position:absolute;bottom:3vmin;top:auto;transform:none;width:calc(var(--side) - 3vmin);background:transparent;border:none;padding:0;z-index:2;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2.4vmin}
  #pad0{left:1.5vmin}#pad1{right:1.5vmin;left:auto}
  #play .pad .pn{font-size:clamp(9px,1.4vmin,15px);line-height:1.5;color:var(--pc);text-align:center}
  #play .dpad{width:15vmin}
  #play .dpad i{background:var(--pc);box-shadow:inset 0 -.5vmin 0 rgba(0,0,0,.35);opacity:1}
  #play .dpad i.c{background:var(--pc);box-shadow:none}
  #play .dpad i.on{background:#fff;box-shadow:0 0 1.6vmin #fff}
  #play .dpad i:not(.c):after{border-width:.9vmin}
  #play .dpad i.u:after{border-bottom-color:#000;margin-top:-.45vmin}#play .dpad i.d:after{border-top-color:#000;margin-top:.45vmin}
  #play .dpad i.l:after{border-right-color:#000;margin-left:-.45vmin}#play .dpad i.r:after{border-left-color:#000;margin-left:.45vmin}
  #play .dpad i.on:after{filter:none}
  #play .abtns{gap:1.6vmin}
  #play .abtn{width:6.5vmin;min-width:34px;background:var(--pc);border:none;color:#000;font-size:clamp(11px,1.6vmin,18px);box-shadow:0 .5vmin 0 rgba(0,0,0,.5);text-shadow:none;opacity:1}
  #play .abtn.b{background:#5d747c;color:#fff;transform:translateY(-1.6vmin)}
  #play .abtn .lab{font-size:clamp(6px,.8vmin,9px)}
  #play .abtn.on,#play .abtn.b.on{background:#fff;color:#000;box-shadow:0 0 1.6vmin #fff}
  #btnQuit{z-index:3}

  /* result */
  #result{align-items:center;justify-content:center}
  #winCanvas{width:44vmin;height:44vmin}
  #resTitle{font-size:clamp(18px,4.4vmin,48px);color:var(--gold);text-shadow:0 0 2.4vmin var(--gold);margin:2vmin;text-align:center}
  #resSub{font-size:clamp(9px,1.5vmin,16px);color:var(--dim);margin-bottom:2vmin;text-align:center;line-height:1.8}

  /* board */
  #board{align-items:center}
  .tbl{width:min(1100px,94vw);flex:1;overflow:auto;touch-action:pan-y;font-size:clamp(9px,1.5vmin,16px)}
  .tbl table{width:100%;border-collapse:collapse}
  .tbl th{color:var(--dim);font-weight:normal;text-align:left;padding:1.2vmin;position:sticky;top:0;background:var(--bg)}
  .tbl td{padding:1vmin 1.2vmin;border-top:.3vmin solid #23292c}
  .tbl tr:nth-child(1) td{color:var(--gold);text-shadow:0 0 1.4vmin var(--gold)}
  .tbl img{width:5vmin;height:5vmin;image-rendering:pixelated;vertical-align:middle}
  .admin{display:flex;gap:1vmin;padding:1vmin 0 2vmin;align-items:center;flex-wrap:wrap;justify-content:center}
  .sync{font-size:clamp(8px,1.2vmin,13px);padding:.6vmin 1vmin;border:.3vmin solid #3a4448;color:var(--dim)}
  .sync.on{color:var(--lime);border-color:var(--lime)}
  .sync.off{color:var(--pink);border-color:var(--pink)}
  .tbl .del{background:transparent;border:.3vmin solid #3a4448;color:var(--pink);font-size:clamp(9px,1.4vmin,15px);padding:.6vmin 1vmin;cursor:pointer}
  .tbl .del:active{background:var(--pink);color:#000}
  #codeDlg{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center}
  #codeDlg.on{display:flex}
  #codeDlg .box{background:var(--panel);border:.6vmin solid var(--pink);box-shadow:0 0 3vmin var(--pink);padding:2.4vmin;display:flex;flex-direction:column;align-items:center;gap:1.4vmin;max-width:94vw}
  #codeDlg h3{margin:0;color:var(--pink);font-size:clamp(12px,2.2vmin,24px);font-weight:normal}
  #codeDlg .q{color:var(--ink);font-size:clamp(10px,1.6vmin,18px);text-align:center;line-height:1.6}
  #codeDlg .dots{font-size:clamp(18px,4vmin,40px);letter-spacing:1.4vmin;color:var(--gold);min-height:5vmin}
  #codeDlg .msg{min-height:2vmin;color:var(--pink);font-size:clamp(9px,1.4vmin,15px);text-align:center}
  #codeDlg .keys{display:grid;grid-template-columns:repeat(3,auto);gap:.6vmin}
  #codeDlg .keys .btn{margin:0;min-width:9vmin}
  #codeDlg .box.shake{animation:shake .35s}
  @keyframes shake{0%,100%{transform:none}25%{transform:translateX(-1.5vmin)}75%{transform:translateX(1.5vmin)}}
  #fsBtn{position:fixed;right:1vmin;top:1vmin;z-index:9;background:transparent;color:var(--dim);border:.3vmin solid #3a4448;font-size:clamp(9px,1.2vmin,13px);padding:.8vmin}
  #soundBtn{position:fixed;top:1vmin;z-index:9;border:.3vmin solid #3a4448;background:#0a0a0a;color:var(--gold);font-size:clamp(10px,1.5vmin,16px);padding:1vmin 1.6vmin}
  #lbTop{position:fixed;top:1vmin;z-index:9;border:.3vmin solid var(--gold);background:#0a0a0a;color:var(--gold);font-family:inherit;font-size:clamp(9px,1.3vmin,14px);padding:.8vmin 1.4vmin;cursor:pointer;box-shadow:0 0 1.2vmin rgba(255,230,0,.35)}
  #lbTop:active{background:var(--gold);color:#000}
  #langBtn{position:fixed;left:1vmin;top:1vmin;z-index:9;display:flex;gap:0;border:.3vmin solid #3a4448;background:#0a0a0a;padding:0;font-size:clamp(10px,1.5vmin,16px)}
  #langBtn b{font-weight:normal;padding:1vmin 1.6vmin;color:var(--dim)}
  #langBtn b.on{background:var(--gold);color:#000;box-shadow:0 0 1.4vmin var(--gold)}
  .logos{display:flex;align-items:center;justify-content:center;gap:5vmin;padding:.6vmin 2vmin 1.4vmin;flex:0 0 auto}
  .logos img{display:block;height:5.2vmin;width:auto;image-rendering:auto;pointer-events:none}
  .logos .lg-uil{height:7vmin}.logos .lg-uva{height:3.6vmin}
  #result .logos,#board .logos{margin-top:auto}
  #cam{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="app">
  <section id="lobby" class="screen on">
    <div class="title">PIXEL <span>ME</span> ARCADE</div>
    <div class="sub" data-i18n="sub"></div>
    <div class="split">
      <div class="panel" id="panel0" style="--pc:var(--p0)"></div>
      <div class="mid"><div class="lbmini" id="lbmini"></div><button class="btn" id="btnBoard" data-i18n="leaderboard"></button></div>

/* The shared leaderboard lives on the server (/api/leaderboard, a Netlify Function + Netlify Blobs).
   This device keeps a copy so the game still works offline; finished games queue up and upload when back online. */
var LB_API='/api/leaderboard',LB_PENDING_KEY='pixelme-lb-pending',LB_STATE='local';
var LB=(function(){try{return JSON.parse(localStorage.getItem(LB_KEY))||{}}catch(e){return {}}})();
function lbLoad(){return LB;}
function lbSave(d){LB=d||{};try{localStorage.setItem(LB_KEY,JSON.stringify(LB))}catch(e){}}
function lbRefreshViews(){if(typeof S==='undefined')return;if(S.screen==='lobby')renderMiniBoard();else if(S.screen==='board')renderBoard();}
function lbStatus(st){LB_STATE=st;var el=document.getElementById('lbSync');if(!el)return;
  el.textContent=T(st==='online'?'lbOnline':st==='offline'?'lbOffline':'lbLocal');el.className='sync '+(st==='online'?'on':st==='offline'?'off':'');}
function lbApi(body){return fetch(LB_API,body?{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}:{cache:'no-store'})
  .then(function(r){var ct=r.headers.get('content-type')||'';if(ct.indexOf('json')<0){var e0=new Error('no api');e0.status=0;throw e0;}
    return r.json().then(function(j){if(!r.ok){var e=new Error(j.error||('HTTP '+r.status));e.status=r.status;throw e;}return j;});});}
function lbPending(){try{return JSON.parse(localStorage.getItem(LB_PENDING_KEY))||[]}catch(e){return []}}
function lbSetPending(a){try{localStorage.setItem(LB_PENDING_KEY,JSON.stringify(a))}catch(e){}}
var lbBusy=false;
function lbSync(){if(lbBusy)return;lbBusy=true;
  (function next(){var q=lbPending();
    if(!q.length){lbApi().then(function(j){lbStatus('online');if(j&&j.board){lbSave(j.board);lbRefreshViews();}})
      .catch(function(){lbStatus(location.protocol==='file:'?'local':'offline')}).then(function(){lbBusy=false});return;}
    var item=q[0];
    lbApi(item).then(function(j){lbSetPending(lbPending().filter(function(x){return x.id!==item.id}));lbStatus('online');if(j&&j.board)lbSave(j.board);next();})
      .catch(function(err){if(err.status===400)lbSetPending(lbPending().filter(function(x){return x.id!==item.id}));
        lbStatus(location.protocol==='file:'?'local':'offline');lbBusy=false;lbRefreshViews();});})();}
setInterval(lbSync,15000);setTimeout(lbSync,0);window.addEventListener('online',lbSync);
document.addEventListener('visibilitychange',function(){if(!document.hidden)lbSync();});
function lbSorted(){return Object.values(lbLoad()).sort(function(a,b){return b.wins-a.wins||(b.wins/Math.max(1,b.played))-(a.wins/Math.max(1,a.played))||b.played-a.played});}
function lbRecord(game,winner){var d=lbLoad();S.players.forEach(function(p,i){var e=d[p.name]||(d[p.name]={name:p.name,wins:0,losses:0,draws:0,played:0,games:{},thumb:''});
  e.played++;if(winner===-1)e.draws++;else if(winner===i){e.wins++;e.games[game]=(e.games[game]||0)+1;}else e.losses++;e.thumb=p.thumb;e.last=Date.now();});lbSave(d);
  var q=lbPending();q.push({action:'record',id:Date.now().toString(36)+Math.random().toString(36).slice(2,10),game:game,
    players:S.players.map(function(p,i){return {name:p.name,thumb:p.thumb||'',result:winner===-1?'draw':winner===i?'win':'loss'}})});
  lbSetPending(q);lbSync();}

function act(i,a,k){var p=S.players[i];SFX.blip();
  if(a==='bot'){if(S.players[1-i].bot)return;S.players[i]=newBot(i);renderPanel(i);renderPanel(1-i);var o2=S.players[1-i];
    if(o2.state==='ready')setTimeout(function(){if(S.players[0].state==='ready'&&S.players[1].state==='ready'&&S.screen==='lobby'){SFX.select();show('select');}},1400);return;}
  if(a==='join'){if(DIL.length){p.state='choose';renderPanel(i);}else{p.state='camera';renderPanel(i);ensureCamera().then(function(){renderPanel(i)});}}
  else if(a==='photo'){p.state='camera';renderPanel(i);ensureCamera().then(function(){renderPanel(i)});}
  else if(a==='dil'){var md=pickDil();if(!md)return;setDil(p,md);p.state='review';renderPanel(i);}
  else if(a==='dprev'||a==='dnext'){if(!DIL.length)return;var ni=((p.dilIdx||0)+(a==='dnext'?1:-1)+DIL.length)%DIL.length;setDil(p,DIL[ni]);renderPanel(i);}
  else if(a==='cancel'){if(p.state==='camera'&&DIL.length){p.state='choose';p.count=0;renderPanel(i);}else{S.players[i]=newPlayer(i);renderPanel(i);}}
  else if(a==='snap'){p.count=3;renderPanel(i);var tm=setInterval(function(){SFX.tick();p.count--;
      if(p.count>0){var c=$('#panel'+i+' .count');if(c)c.textContent=p.count;return;}

      else{var F=null;if(SEG){try{F=CARTOON.extract(img.canvas,SEG)}catch(e){F=null}}
        p.frames=F?CARTOON.frames(F):makeFrames(pixelate(img));p.thumb=makeThumb(p.frames);p.dil=null;}
      p.state='review';setTimeout(function(){renderPanel(i)},150);},750);
    var c0=$('#panel'+i+' .count');if(c0)c0.textContent='3';}
  else if(a==='surprise'){var m=pickDil(p.dil);if(!m)return;setDil(p,m);p.state='review';renderPanel(i);}
  else if(a==='retake'){var toCam=p.state==='review'&&!p.dil;p.state=toCam?'camera':'choose';p.frames=null;p.dil=null;p.name='';p.returning=false;renderPanel(i);renderPanel(1-i);

  else if(a==='keep'){p.state='name';p.note='';if(p.dil&&!p.name)p.name=p.dilShort;renderPanel(i);}
  else if(a==='key'){if(p.name.length<8)p.name+=k;p.note='';renderPanel(i);}

function bindDpad(el,i){var act=new Map();
  function dirs(e){var r=el.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),m=Math.hypot(dx,dy);
    if(m<r.width*0.1)return [];var out=[];if(Math.abs(dx)>m*0.38)out.push(dx>0?'right':'left');if(Math.abs(dy)>m*0.38)out.push(dy>0?'down':'up');return out;}
  function upd(){var st={up:0,down:0,left:0,right:0};act.forEach(function(ds){ds.forEach(function(d){st[d]=1})});
    ['up','down','left','right'].forEach(function(k){input[i][k]=st[k]});
    el.querySelector('.u').classList.toggle('on',!!st.up);el.querySelector('.d').classList.toggle('on',!!st.down);
    el.querySelector('.l').classList.toggle('on',!!st.left);el.querySelector('.r').classList.toggle('on',!!st.right);}

/* ---------- GAME 2: Light Cycles ---------- */

/* ---------- GAME 3: Coin Rush ---------- */
function Coins(){var W=800,H=600,SZ=88;

/* ---------- GAME 4: Pixel Dash (dodging race, like the offline dinosaur game) ---------- */
function Dash(){var W=800,H=600,SZ=100,RX=215,GR=[262,562],GRAV=2700,JV=940;
  var G={t:0,dist:0,speed:360,obs:[],next:1100,lives:[3,3],out:[false,false],inv:[0,0],wait:1.8,done:false,winner:null,_pa:[0,0],_pu:[0,0],time:75,
    pl:[{y:0,vy:0,duck:false},{y:0,vy:0,duck:false}],bursts:[]};
  function spawn(){var k=Math.random(),lvl=Math.min(1,G.t/50),o;
    if(k<0.42)o={type:'cactus',w:26+Math.floor(Math.random()*2)*22,h:44+Math.floor(Math.random()*3)*10,fy:0};
    else if(k<0.62)o={type:'tall',w:30,h:88,fy:0};
    else if(k<0.84&&G.t>6)o={type:'owl',w:44,h:26,fy:[58,128][Math.floor(Math.random()*2)]};   /* low owl: duck; high owl: stay on the ground */
    else o={type:'cactus',w:70,h:40,fy:0};
    var pick=function(a){return a[Math.floor(Math.random()*a.length)]};
    if(o.type==='cactus')o.kind=o.w>=70?'copier':o.w>30?pick(['paper','printer','boxes']):pick(['bin','chair']);
    else if(o.type==='tall')o.kind=pick(['cooler','cabinet']);
    o.x=G.dist+W+60;o.hit=[false,false];G.obs.push(o);
    G.next=G.dist+W+60+o.w+Math.max(360,(520+Math.random()*480)*(1-lvl*0.25)*(G.speed/360));}
  function box(p){var q=G.pl[p],hgt=q.duck&&q.y===0?40:84;return {x0:RX+30,x1:RX+SZ-30,lo:q.y,hi:q.y+hgt};}   /* heights measured upward from the ground */
  G.update=function(dt){
    for(var p=0;p<2;p++){var I=input[p],q=G.pl[p],pa=edge(G,p),pu=I.up&&!G._pu[p];G._pu[p]=I.up;
      if(G.out[p]||G.wait>0)continue;
      if(I.down&&!q.duck&&q.y===0)SFX.duck();q.duck=!!I.down;
      if((pa||pu||(I.b&&q.y===0&&q.vy===0))&&q.y===0){q.vy=JV;SFX.jump();}
      if(q.duck&&q.y>0)q.vy-=GRAV*1.6*dt;                                           /* fast-fall when ducking mid-air */
      var air=q.y>0;q.vy-=GRAV*dt;q.y+=q.vy*dt;if(q.y<=0){q.y=0;q.vy=0;if(air)SFX.land();}
      if(G.inv[p]>0)G.inv[p]-=dt;}
    if(G.wait>0){G.wait-=dt;return;}
    G.t+=dt;G.time-=dt;G.speed=Math.min(920,360+G.t*9);G.dist+=G.speed*dt;
    if(G.dist+W+60>=G.next)spawn();
    G.obs=G.obs.filter(function(o){return o.x-G.dist>-120});
    for(p=0;p<2;p++){if(G.out[p]||G.inv[p]>0)continue;var b=box(p);
      for(var i=0;i<G.obs.length;i++){var o=G.obs[i];if(o.hit[p])continue;var ox=o.x-G.dist;
        if(ox<b.x1&&ox+o.w>b.x0&&o.fy<b.hi&&o.fy+o.h>b.lo){o.hit[p]=true;G.lives[p]--;G.inv[p]=1.3;G.bursts.push({x:RX+SZ/2,y:GR[p]-30,t:0.5,p:p});
          if(G.lives[p]<=0){G.out[p]=true;SFX.ko();}else SFX.crash();break;}}}
    var ms=Math.floor(G.dist/1000);if(ms>(G.ms||0)){G.ms=ms;SFX.milestone();}
    G.obs.forEach(function(o){if(o.type==='owl'&&!o.hooted&&o.x-G.dist<W-40){o.hooted=true;SFX.owl();}});
    G.bursts.forEach(function(k){k.t-=dt});G.bursts=G.bursts.filter(function(k){return k.t>0});
    if(G.out[0]||G.out[1]||G.time<=0){G.time=Math.max(0,G.time);G.done=true;
      if(G.out[0]&&G.out[1])G.winner=-1;else if(G.out[0])G.winner=1;else if(G.out[1])G.winner=0;
      else G.winner=G.lives[0]>G.lives[1]?0:G.lives[1]>G.lives[0]?1:-1;}};
  function drawObs(ctx,o,x,gy){var y=gy-o.fy-o.h;
    if(o.type==='owl'){var fl=Math.floor(G.t*8)%2;ctx.fillStyle='#ff3d9a';ctx.fillRect(x+10,y+4,24,20);ctx.fillRect(x+12,y,6,4);ctx.fillRect(x+26,y,6,4);
      ctx.fillRect(x,y+(fl?0:12),10,6);ctx.fillRect(x+34,y+(fl?0:12),10,6);ctx.fillStyle='#000';ctx.fillRect(x+15,y+8,5,5);ctx.fillRect(x+24,y+8,5,5);
      ctx.fillStyle='#ffe600';ctx.fillRect(x+20,y+14,4,4);return;}
    officeObj(ctx,o.kind||'bin',x,y,o.w,o.h);}
  G.draw=function(ctx,t){ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
    for(var p=0;p<2;p++){var top=p*300,gy=GR[p],q=G.pl[p];
      /* faded office wall scrolling past */
      var x;officeWall(ctx,top,gy,W,G.dist*0.35,COLORS[p]);
      /* ground */
      ctx.fillStyle=COLORS[p];ctx.fillRect(0,gy,W,3);ctx.fillStyle='#16191b';
      for(x=-((G.dist)%40);x<W;x+=40)ctx.fillRect(x,gy+10+(Math.floor((x+G.dist)/40)%3)*8,14,3);
      G.obs.forEach(function(o){var ox=o.x-G.dist;if(ox<W+60&&ox>-100)drawObs(ctx,o,ox,gy);});
      /* runner */
      var ducking=q.duck&&q.y===0&&!G.out[p],anim=G.out[p]?'idle':(q.y>0?'idle':'walk');
      if(G.inv[p]>0&&Math.floor(t*14)%2)ctx.globalAlpha=.35;
      if(ducking){ctx.save();ctx.translate(RX-8,gy+6);ctx.scale(1.16,0.56);drawSprite(ctx,S.players[p].frames,0,-SZ,SZ,'walk',t*1.8,false);ctx.restore();}
      else drawSprite(ctx,S.players[p].frames,RX,gy-SZ-q.y+6,SZ,anim,t*(1+G.speed/600),false);
      ctx.globalAlpha=1;
      ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(RX+24,gy+4,Math.max(8,SZ-48-(q.y/8)),5);
      /* hud */
      txt(ctx,S.players[p].name,20,top+26,14,COLORS[p],'left');
      for(var l=0;l<3;l++){ctx.fillStyle=l<G.lives[p]?'#ff3d9a':'#23292c';var hx=20+l*26,hy2=top+44;ctx.fillRect(hx,hy2+3,18,9);ctx.fillRect(hx+3,hy2,5,15);ctx.fillRect(hx+10,hy2,5,15);ctx.fillRect(hx+6,hy2+12,6,4);}
      if(G.out[p])txt(ctx,'K.O.!',W/2,top+140,40,'#ff3d9a');
      if(p===0){ctx.fillStyle='#23292c';ctx.fillRect(0,298,W,4);}}
    G.bursts.forEach(function(k){for(var i=0;i<10;i++){var a=i*0.63,rr=(0.5-k.t)*160;ctx.fillStyle=i%2?'#ffe600':COLORS[k.p];ctx.fillRect(k.x+Math.cos(a)*rr-3,k.y+Math.sin(a)*rr-3,6,6);}});
    txt(ctx,String(Math.floor(G.dist/10)).padStart(5,'0'),W-20,26,16,'#86a9b4','right');
    txt(ctx,String(Math.ceil(G.time)),W-20,326,16,G.time<10?'#ff5b5b':'#86a9b4','right');
    if(G.wait>0)countdown(ctx,G.wait,W,H);};
  return G;}

/* ---------- result ---------- */
var winCtx=$('#winCanvas').getContext('2d');
function fillResult(){var w=S.game.winner,P=S.players;
  $('#resTitle').textContent=w===-1?T('draw'):T('wins',{name:P[w].name});
  var d=lbLoad(),e0=d[P[0].name]||{wins:0},e1=d[P[1].name]||{wins:0};
  $('#resSub').innerHTML=GAMES[S.gameId].name+'<br>'+esc(P[0].name)+': '+e0.wins+' '+T('totalWins')+' · '+esc(P[1].name)+': '+e1.wins+' '+T('totalWins');}
function showResult(){fillResult();
  show('result');SFX.win();}
function drawResult(t){var c=winCtx,w=S.game?S.game.winner:-1;c.clearRect(0,0,256,256);
  if(w===-1){drawSprite(c,S.players[0].frames,0,64,128,'dance',t,false);drawSprite(c,S.players[1].frames,128,64,128,'dance',t+.3,true);}
  else{for(var k=0;k<14;k++){c.fillStyle=k%2?'#ffe600':COLORS[w];var a=t*1.5+k*0.45;c.fillRect(128+Math.cos(a)*(90+k%3*12)-3,128+Math.sin(a)*(90+k%3*12)-3,6,6);}
    drawSprite(c,S.players[w].frames,32,24+Math.abs(Math.sin(t*5))*-10+10,192,'dance',t,Math.floor(t*2)%2===1);}}
$('#btnRematch').onclick=function(){startGame(S.gameId)};
$('#btnOther').onclick=function(){show('select')};
function newPlayers(){S.players=[newPlayer(0),newPlayer(1)];S.game=null;show('lobby');}
$('#btnNewPlayers').onclick=newPlayers;$('#btnNew2').onclick=newPlayers;
$('#btnBoard').onclick=function(){S.boardBack='lobby';show('board')};$('#btnBoard2').onclick=function(){S.boardBack='result';show('board')};
$('#btnBack').onclick=function(){show(S.boardBack||'lobby')};
/* leaderboard button in the top bar, reachable from every screen (leaving a game in progress returns to the game menu afterwards) */
(function(){var b=$('#lbTop'),fs=$('#fsBtn');function place(){b.style.right=(innerWidth-fs.getBoundingClientRect().left+8)+'px';}place();addEventListener('resize',place);setTimeout(place,500);
  b.addEventListener('click',function(e){e.stopPropagation();SFX.blip();if(INTRO.id)closeIntro(false);
    var from=S.screen;if(from==='play'){S.game=null;from='select';}S.boardBack=from;show('board');});})();

/* ---------- admin: export / import / reset ---------- */
$('#btnExport').onclick=function(){var b=new Blob([JSON.stringify(lbLoad(),null,1)],{type:'application/json'});var a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='pixel-me-leaderboard-'+new Date().toISOString().slice(0,10)+'.json';a.click();};
$('#btnImport').onclick=function(){$('#fileImport').click()};
$('#fileImport').onchange=function(e){var f=e.target.files[0];if(!f)return;f.text().then(function(s){try{var inc=JSON.parse(s),d=lbLoad();
  if(!inc||typeof inc!=='object'||Array.isArray(inc))throw 0;askCode({type:'import',data:inc});}catch(_){alert(T('badFile'));}});e.target.value='';};
$('#btnReset').onclick=function(){askCode({type:'reset'})};
$('#lbBody').addEventListener('click',function(e){var b=e.target.closest('[data-del]');if(b)askCode({type:'delete',name:b.getAttribute('data-del')});});

/* ---------- confirmation-code dialog (the code is checked on the server, never stored in this page) ---------- */
var CODE={job:null,val:'',busy:false};
(function(){var k=$('#codeKeys'),h='';['1','2','3','4','5','6','7','8','9','⌫','0',''].forEach(function(c){
  h+=c?'<button class="btn alt" data-k="'+c+'">'+c+'</button>':'<span></span>';});k.innerHTML=h;
  k.addEventListener('click',function(e){var b=e.target.closest('[data-k]');if(!b)return;codeKey(b.getAttribute('data-k'));});})();
function codeKey(c){if(CODE.busy)return;if(c==='⌫')CODE.val=CODE.val.slice(0,-1);else if(/^[0-9]$/.test(c)&&CODE.val.length<8)CODE.val+=c;
  $('#codeDots').textContent=CODE.val.replace(/./g,'●')||'····';$('#codeMsg').textContent='';}
function askCode(job){CODE.job=job;CODE.val='';CODE.busy=false;
  $('#codeQ').textContent=job.type==='delete'?T('confirmDel',{name:job.name}):job.type==='reset'?T('confirmReset'):T('confirmImport');
  $('#codeDots').textContent='····';$('#codeMsg').textContent='';$('#codeDlg').classList.add('on');}
function closeCode(){$('#codeDlg').classList.remove('on');CODE.job=null;CODE.val='';}
function codeFail(msg){$('#codeMsg').textContent=msg;var bx=$('#codeDlg .box');bx.classList.remove('shake');void bx.offsetWidth;bx.classList.add('shake');}
function submitCode(){var j=CODE.job;if(!j||CODE.busy||!CODE.val)return;CODE.busy=true;
  var body={action:j.type,code:CODE.val};if(j.type==='delete')body.name=j.name;if(j.type==='import')body.data=j.data;
  lbApi(body).then(function(r){CODE.busy=false;
      if(j.type==='delete')lbSetPending(lbPending().map(function(x){x.players=(x.players||[]).filter(function(p){return p.name!==j.name});return x;}).filter(function(x){return x.players.length}));
      if(j.type==='reset')lbSetPending([]);
      lbSave(r.board||{});lbStatus('online');closeCode();renderBoard();})
    .catch(function(err){CODE.busy=false;CODE.val='';$('#codeDots').textContent='····';
      codeFail(err.status===403?T('wrongCode'):err.status===429?T('tooMany'):T('noServer'));});}
$('#codeOk').onclick=submitCode;$('#codeCancel').onclick=closeCode;
document.addEventListener('keydown',function(e){if(!$('#codeDlg').classList.contains('on'))return;
  if(/^[0-9]$/.test(e.key))codeKey(e.key);else if(e.key==='Backspace')codeKey('⌫');else if(e.key==='Enter')submitCode();else if(e.key==='Escape')closeCode();else return;
  e.preventDefault();e.stopPropagation();},true);

/* ---------- fullscreen, idle reset, misc ---------- */
document.querySelectorAll('#langBtn b').forEach(function(b){b.addEventListener('click',function(e){e.stopPropagation();setLang(b.dataset.l)})});
(function(){var sb=$('#soundBtn'),lb=$('#langBtn');function place(){sb.style.left=(lb.getBoundingClientRect().right+8)+'px';}place();addEventListener('resize',place);setTimeout(place,500);
  sb.addEventListener('click',function(e){e.stopPropagation();setMuted(!muted);if(!muted){audio();musicFor(S.screen);SFX.blip();}});setMuted(muted);})();
$('#fsBtn').onclick=function(){var el=document.documentElement,d=document,on=d.fullscreenElement||d.webkitFullscreenElement;
  try{if(!on){if(el.requestFullscreen)el.requestFullscreen().catch(function(){});else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();}
  else{if(d.exitFullscreen)d.exitFullscreen();else if(d.webkitExitFullscreen)d.webkitExitFullscreen();}}catch(e){}};
document.addEventListener('fullscreenchange',function(){$('#fsBtn').style.opacity=document.fullscreenElement?'.25':'1'});
addEventListener('contextmenu',function(e){e.preventDefault()});
addEventListener('pointerdown',function(){S.lastTouch=performance.now()},true);addEventListener('keydown',function(){S.lastTouch=performance.now()},true);
addEventListener('gesturestart',function(e){e.preventDefault()});

/* ---------- main loop ---------- */
var last=performance.now();
function loop(now){var t=now/1000,dt=Math.min(0.05,(now-last)/1000);last=now;
  if(S.screen==='lobby'){[0,1].forEach(function(i){var p=S.players[i],el=$('#panel'+i);
      var pv=el.querySelector('.preview');if(pv&&camReady){drawVideoSquare(pv.getContext('2d'),320);}
      else if(pv){var x=pv.getContext('2d');x.fillStyle='#000';x.fillRect(0,0,320,320);}
      var sb=el.querySelector('.spritebig');if(sb&&p.frames){var c=sb.getContext('2d');drawOfficeBehind(c,p,256);drawSprite(c,p.frames,0,0,256,p.state==='ready'?'dance':'idle',t,i===1);}
      var ss=el.querySelector('.spritesm');if(ss&&p.frames){var c2=ss.getContext('2d');drawOfficeBehind(c2,p,128);drawSprite(c2,p.frames,0,0,128,'idle',t,false);}});}
  else if(S.screen==='select'){[0,1].forEach(function(i){var c=$('#selSp'+i).getContext('2d');c.clearRect(0,0,128,128);drawSprite(c,S.players[i].frames,0,0,128,'dance',t+i*.4,i===1);});
    document.querySelectorAll('[data-prev]').forEach(function(cv){drawPreview(cv.getContext('2d'),cv.dataset.prev,t);});
    }
  else if(S.screen==='play'&&S.game){var G=S.game,pw=G.wait;BOT.step(dt);if(!G.done)G.update(dt);
    if(pw>1&&G.wait<=1&&G.wait>0)SFX.ready();if(pw>0&&G.wait<=0&&!G.done)SFX.go();g.imageSmoothingEnabled=false;G.draw(g,t);
    if(G.done){if(!S.recorded){S.recorded=true;lbRecord(S.gameId,G.winner);S.endAt=now+1500;}
      txt(g,G.winner===-1?T('cDraw'):T('cWins',{name:S.players[G.winner].name}),400,300,34,'#ffe600');if(now>S.endAt)showResult();}}
  else if(S.screen==='result'){drawResult(t);}
  introTick(now,t);idleTick(now);
  requestAnimationFrame(loop);}
/* Idle reset: after 5 minutes without a tap the notice appears and counts down 20 s, then it goes back to the start screen (not during a game). */
var IDLE_WARN=20000,IDLE_MS=5*60*1000+IDLE_WARN;
function idleActive(){if(S.screen==='play'&&!INTRO.id)return false;
  if(S.screen==='lobby')return S.players.some(function(p){return p.state!=='waiting'&&!(p.state==='camera'&&p.count)});
  return true;}
function idleTick(now){var el=$('#idle');if(!idleActive()||$('#codeDlg').classList.contains('on')){S.lastTouch=Math.max(S.lastTouch,now-1000);el.classList.remove('on');return;}
  var left=IDLE_MS-(now-S.lastTouch);
  if(left<=0){el.classList.remove('on');closeIntro(false);newPlayers();S.lastTouch=now;return;}
  if(left<=IDLE_WARN){el.textContent=T('idleMsg',{n:Math.ceil(left/1000)});el.classList.add('on');}else el.classList.remove('on');}
function drawPreview(c,k,t){c.fillStyle='#050505';c.fillRect(0,0,160,120);c.imageSmoothingEnabled=false;
  if(k==='pong'){c.drawImage(pongBg(),0,0,160,120);c.globalAlpha=.6;drawSprite(c,S.players[0].frames,18,70,44,'idle',t,false);drawSprite(c,S.players[1].frames,98,70,44,'idle',t,true);c.globalAlpha=1;
    c.fillStyle=COLORS[0];c.fillRect(8,40+Math.sin(t*2)*20,6,30);c.fillStyle=COLORS[1];c.fillRect(146,40+Math.cos(t*2)*20,6,30);
    var bx=80+Math.sin(t*1.7)*55,by=55+Math.sin(t*3.1)*36,ci=Math.floor(t*1.7/Math.PI+.5)%5;drawPacket(c,bx,by,byteBits('HELLO'[ci]),COLORS[ci%2],.36);}
  else if(k==='cycles'){c.drawImage(wiresBg(),0,0,160,120);var n=Math.floor((t*30)%120),i,ax=10+Math.min(n,70),ay=30+Math.max(0,n-70),bx2=146-Math.min(n,70),by2=90-Math.max(0,n-70);
    c.fillStyle='#000';for(i=0;i<n;i++){c.fillRect(9+Math.min(i,70),29+Math.max(0,i-70),6,6);c.fillRect(145-Math.min(i,70),89-Math.max(0,i-70),6,6);}
    c.fillStyle=COLORS[0];for(i=0;i<n;i++)c.fillRect(10+Math.min(i,70),30+Math.max(0,i-70),4,4);
    c.fillStyle=COLORS[1];for(i=0;i<n;i++)c.fillRect(146-Math.min(i,70),90-Math.max(0,i-70),4,4);
    drawSprite(c,S.players[0].frames,ax-14,ay-30,30,'walk',t,false);drawSprite(c,S.players[1].frames,bx2-14,by2-30,30,'walk',t,true);}
  else if(k==='dash'){officeWall(c,0,100,160,t*40,COLORS[0]);c.fillStyle=COLORS[0];c.fillRect(0,100,160,2);var cx=((150-(t*90)%200)+200)%200-20;officeObj(c,'bin',cx-3,84,14,16);
    var ph=((t*90)%200)/200,jy=(cx>20&&cx<75)?Math.sin(Math.min(1,(75-cx)/55)*Math.PI)*34:0;drawSprite(c,S.players[0].frames,30,62-jy,40,jy?'idle':'walk',t*2,false);
    c.fillStyle='#ff3d9a';var ox=((260-(t*120)%260)+260)%260-40;c.fillRect(ox,34,14,9);c.fillRect(ox-5,34+(Math.floor(t*8)%2?0:5),5,3);c.fillRect(ox+14,34+(Math.floor(t*8)%2?0:5),5,3);}
  else{c.drawImage(vaultBg(),0,0,160,120);for(i=0;i<5;i++)drawCoin(c,20+i*28,50+(i%2)*25,12,t*3+i);
    drawSprite(c,S.players[0].frames,10+((t*40)%100),70,40,'walk',t,false);}}
requestAnimationFrame(loop);
applyStatic();
show('lobby');
loadDil();
})();
